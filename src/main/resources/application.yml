server:
  port: ${SERVER_PORT}

spring:
  application:
    name: ${SERVER_NAME}
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5434}/${PG_DATABASE:trello_db}
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate   # hoặc update/create cho dev
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Connection pool (HikariCP default)

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}

# Optional: Flyway migration
flyway:
  enabled: true
  locations: classpath:db/migration