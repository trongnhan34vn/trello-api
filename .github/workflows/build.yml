name: Nello API

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 1

      - name: Deploy app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat > /home/ubuntu/app/.env << 'EOF'
            ${{ secrets.ENV_FILE }}
            EOF

            JAR_FILE=$(ls /home/ubuntu/app/*.jar | grep -v 'original' | grep -v 'app.jar' | head -1)
            cp "$JAR_FILE" /home/ubuntu/app/app.jar
      
            sudo systemctl restart nello-api
            sleep 3
            sudo systemctl status nello-api --no-pager